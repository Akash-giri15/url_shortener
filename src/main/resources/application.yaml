
spring:
  application:
    name: demo2
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 30   # deliberately chosen, not left at Hikari's default of 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate     # Hibernate CHECKS your entities against the schema, never alters it
    show-sql: true           # prints generated SQL to your console -- great while learning
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  threads:
    virtual:
      enabled: true   # Tomcat now hands each request a virtual thread, not a platform thread

app:
  base-url: http://localhost:8080   # configurable now so it's not a hardcoded literal in Java
  cache:
    ttl-seconds: 3600


